# ===============================================================
# GitLab CI/CD Pipeline Configuration for MCP Gateway
# featuring:
#   - Multi-stage pipeline (lint, test, build, deploy)
#   - Python 3.11, 3.12, 3.13 matrix testing
#   - Code quality checks (flake8, bandit, mypy, pylint)
#   - Unit tests with coverage reporting
#   - Docker image building and scanning
#   - Security scanning (CodeQL, SAST)
#   - Artifact management
#
# Environment Variables to Set in GitLab:
#   - REGISTRY_URL: Docker registry URL (e.g., registry.gitlab.com)
#   - REGISTRY_USER: Registry username
#   - REGISTRY_PASSWORD: Registry password/token
#   - SONAR_HOST_URL: SonarQube host (optional)
#   - SONAR_TOKEN: SonarQube token (optional)
#
# ===============================================================

# Global configuration
stages:
  - code-quality
  - test
  - build
  - security
  - deploy

# Global variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_BUILDKIT: "1"
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"
  REGISTRY_URL: "${CI_REGISTRY}"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_VERSION: "0.9.2"

# Cache configuration
cache:
  paths:
    - .cache/pip
    - .venv/
    - .ruff_cache/
    - .mypy_cache/

# Define which branches/tags trigger pipelines
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# ===============================================================
# LINT & CODE QUALITY STAGE
# ===============================================================

# Lint: Formatting (Black, isort, trailing-whitespace)
lint:formatting:
  stage: code-quality
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install black isort
  script:
    - echo "Checking code formatting (Black)..."
    - black --check --diff mcpgateway/ tests/ scripts/ || true
    - echo "Checking import sorting (isort)..."
    - isort --check-only --diff mcpgateway/ tests/ scripts/ || true
  allow_failure: true
  artifacts:
    reports:
      codequality: code-quality.json
    expire_in: 1 week

# Lint: Security analysis with Bandit
lint:security-bandit:
  stage: code-quality
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install bandit
  script:
    - echo "Running Bandit security analysis..."
    - bandit -r mcpgateway/ --format json --output bandit-report.json -ll --severity-level medium || true
    - bandit -r mcpgateway/ -ll --severity-level medium
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true

# Lint: YAML validation
lint:yaml:
  stage: code-quality
  image: python:3.12
  before_script:
    - pip install --upgrade pip yamllint
  script:
    - echo "Validating YAML files..."
    - yamllint -c .yamllint docker-compose*.yml docker-compose*.yaml .github/workflows/*.yml .gitlab-ci.yml || true
  allow_failure: true

# Lint: Flake8
lint:flake8:
  stage: code-quality
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install flake8 flake8-bugbear flake8-async
  script:
    - echo "Running Flake8..."
    - flake8 mcpgateway/ tests/ scripts/ --config .flake8 --count || true
  allow_failure: true
  artifacts:
    expire_in: 1 week

# ===============================================================
# TESTING STAGE
# ===============================================================

# Test: Unit tests with coverage (Python 3.11)
test:unit:py311:
  stage: test
  image: python:3.11
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install --group dev . 2>&1 | tail -20
  script:
    - echo "Running unit tests (Python 3.11) with coverage..."
    - |
      uv run pytest \
        --ignore=tests/fuzz \
        --cov=mcpgateway \
        --cov-report=xml \
        --cov-report=html \
        --cov-report=term \
        --cov-branch \
        --cov-fail-under=60 \
        -v \
        --tb=short \
        -n 4
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 30 days
  allow_failure: false

# Test: Unit tests with coverage (Python 3.12)
test:unit:py312:
  stage: test
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install --group dev . 2>&1 | tail -20
  script:
    - echo "Running unit tests (Python 3.12) with coverage..."
    - |
      uv run pytest \
        --ignore=tests/fuzz \
        --cov=mcpgateway \
        --cov-report=xml \
        --cov-report=html \
        --cov-report=term \
        --cov-branch \
        --cov-fail-under=60 \
        -v \
        --tb=short \
        -n 4
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 30 days

# Test: Unit tests with coverage (Python 3.13)
test:unit:py313:
  stage: test
  image: python:3.13
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install --group dev . 2>&1 | tail -20
  script:
    - echo "Running unit tests (Python 3.13) with coverage..."
    - |
      uv run pytest \
        --ignore=tests/fuzz \
        --cov=mcpgateway \
        --cov-report=xml \
        --cov-report=html \
        --cov-report=term \
        --cov-branch \
        --cov-fail-under=60 \
        -v \
        --tb=short \
        -n 4
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 30 days
  allow_failure: true  # Python 3.13 is optional

# Test: Type checking with mypy
test:mypy:
  stage: test
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install --group dev . mypy 2>&1 | tail -20
  script:
    - echo "Running mypy type checking..."
    - mypy mcpgateway/ --config-file pyproject.toml --junit-xml mypy-report.xml || true
  artifacts:
    reports:
      junit: mypy-report.xml
    expire_in: 1 week
  allow_failure: true

# Test: Doctest coverage
test:doctest:
  stage: test
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install --group dev . 2>&1 | tail -20
  script:
    - echo "Running doctest..."
    - |
      uv run pytest \
        --doctest-modules mcpgateway/ \
        --cov=mcpgateway \
        --cov-report=term \
        --ignore=mcpgateway/utils/pagination.py \
        --tb=short \
        -n 4
  allow_failure: true

# ═══════════════════════════════════════════════════════════════
# BUILD STAGE (Docker Images)
# ═══════════════════════════════════════════════════════════════

# Build Docker image for main branch
build:docker:main:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  only:
    - main
    - tags
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image for main branch..."
    - |
      docker build \
        -t $CI_REGISTRY_IMAGE:latest \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA \
        -t $CI_REGISTRY_IMAGE:main \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        --build-arg VERSION=$CI_COMMIT_REF_NAME \
        -f Containerfile \
        .
    - echo "Pushing Docker image to registry..."
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:main
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week

# Build Docker image for release tags
build:docker:release:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  only:
    - tags
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image for release tag $CI_COMMIT_TAG..."
    - |
      docker build \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG \
        -t $CI_REGISTRY_IMAGE:latest \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        --build-arg VERSION=$CI_COMMIT_TAG \
        -f Containerfile \
        .
    - echo "Pushing release image..."
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE:latest

# Build multi-platform Docker image (for main branch only)
build:docker:multiplatform:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  only:
    - main
    - tags
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use --name multibuilder || docker buildx use multibuilder
  script:
    - echo "Building multi-platform Docker image..."
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t $CI_REGISTRY_IMAGE:multiplatform \
        --push \
        -f Containerfile \
        .
  allow_failure: true  # Multi-platform builds may not always be available

# ═══════════════════════════════════════════════════════════════
# SECURITY STAGE
# ═══════════════════════════════════════════════════════════════

# Scan Docker image for vulnerabilities (Trivy)
security:trivy:
  stage: security
  image: aquasec/trivy:latest
  only:
    - main
    - tags
  script:
    - echo "Scanning Docker image with Trivy..."
    - |
      trivy image \
        --severity HIGH,CRITICAL \
        --exit-code 0 \
        --format json \
        --output trivy-report.json \
        $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA || true
  artifacts:
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
    expire_in: 30 days
  allow_failure: true

# SAST: Semgrep static analysis
security:semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
    - echo "Running Semgrep SAST analysis..."
    - |
      semgrep \
        --config=semgrep.yml \
        --json \
        --output=semgrep-report.json \
        mcpgateway/ || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - semgrep-report.json
    expire_in: 30 days
  allow_failure: true

# Dependency scanning: Safety
security:safety:
  stage: security
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install safety 2>&1 | tail -10
  script:
    - echo "Checking dependencies for known vulnerabilities..."
    - safety check --json --output safety-report.json || true
  artifacts:
    paths:
      - safety-report.json
    expire_in: 30 days
  allow_failure: true

# License compliance check
security:license:
  stage: security
  image: python:3.12
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install pip-licenses 2>&1 | tail -10
  script:
    - echo "Checking license compliance..."
    - pip-licenses --format=json --with-urls --output-file licenses-report.json || true
  artifacts:
    paths:
      - licenses-report.json
    expire_in: 30 days
  allow_failure: true

