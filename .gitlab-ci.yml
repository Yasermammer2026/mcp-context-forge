# ═══════════════════════════════════════════════════════════════
#  REPORTING STAGE
# ═══════════════════════════════════════════════════════════════

# Generate pipeline reports
pages:
  stage: build
  image: python:3.12
  only:
    - main
  script:
    - mkdir -p public/coverage public/reports
    - |
      if [ -d htmlcov ]; then
        cp -r htmlcov/* public/coverage/
        echo "Coverage report available"
      fi
    - |
      echo "<!DOCTYPE html>
      <html>
      <head>
        <title>MCP Gateway CI/CD Reports</title>
        <style>
          body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
          h1 { color: #333; }
          .report { background: white; padding: 20px; margin: 10px 0; border-radius: 5px; }
          a { color: #0066cc; text-decoration: none; }
          a:hover { text-decoration: underline; }
          .status { padding: 10px; border-radius: 3px; margin: 5px 0; }
          .success { background: #d4edda; color: #155724; }
          .info { background: #d1ecf1; color: #0c5460; }
        </style>
      </head>
      <body>
        <h1>MCP Gateway - CI/CD Pipeline Reports</h1>
        <div class='report'>
          <h2>Test Coverage</h2>
          <p><a href='coverage/index.html'>View Detailed Coverage Report</a></p>
          <p class='status info'>Coverage reports are generated from unit tests</p>
        </div>
        <div class='report'>
          <h2>Security Scanning</h2>
          <p>Security reports are available as artifacts in the CI/CD pipeline</p>
          <ul>
            <li>Trivy: Container image vulnerability scanning</li>
            <li>Bandit: Python security linting</li>
            <li>Semgrep: Static code analysis</li>
            <li>Safety: Dependency vulnerability checking</li>
          </ul>
        </div>
        <div class='report'>
          <h2>Linting & Quality</h2>
          <p>Code quality checks are run on every commit</p>
          <ul>
            <li>Black: Code formatting</li>
            <li>isort: Import sorting</li>
            <li>Flake8: PEP8 compliance</li>
            <li>mypy: Type checking</li>
          </ul>
        </div>
        <div class='report'>
          <h2>Test Results</h2>
          <p class='status success'>Unit tests run on Python 3.11, 3.12, 3.13</p>
          <p>Check the pipeline job logs for detailed test results</p>
        </div>
      </body>
      </html>" > public/index.html
  artifacts:
    paths:
      - public
    expire_in: 30 days
  dependencies:
    - test:unit:py312
  allow_failure: true

# ═══════════════════════════════════════════════════════════════
#  HELPER JOBS (triggered manually)
# ═══════════════════════════════════════════════════════════════

# Smoke test job
test:smoke:
  stage: test
  image: python:3.12
  when: manual
  before_script:
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install --group dev . 2>&1 | tail -20
  script:
    - echo "Running smoke tests..."
    - python smoketest.py --verbose || true
  allow_failure: true