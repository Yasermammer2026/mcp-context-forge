# ═══════════════════════════════════════════════════════════════
# BUILD STAGE (Docker Images)
# ═══════════════════════════════════════════════════════════════

# Build Docker image for main branch
build:docker:main:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    - main
    - ci/setup-pipeline
    - tags
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"${CI_REGISTRY}":{"username":"${CI_REGISTRY_USER}","password":"${CI_REGISTRY_PASSWORD}"}}}
      EOF
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Containerfile" \
        --destination "${CI_REGISTRY_IMAGE}:latest" \
        --cache=true


# Build multi-platform Docker image (for main branch only)
build:docker:multiplatform:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "ci/setup-pipeline"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF

    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Containerfile" \
        --destination "$CI_REGISTRY_IMAGE:multiplatform-amd64" \
        --cache=true

    - echo "Skipping arm64 build on non-arm runner (exec format error)."


# ═══════════════════════════════════════════════════════════════
# SECURITY STAGE
# ═══════════════════════════════════════════════════════════════

# Scan Docker image for vulnerabilities (Trivy)
security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]   
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "ci/setup-pipeline"'
    - if: '$CI_COMMIT_TAG'
  needs:

    - job: build:docker:main
      optional: true
    - job: build:docker:multiplatform
      optional: true

  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"

  script:
    - echo "Scanning Docker image with Trivy..."
    - trivy --version
    - |
      IMAGE_TAG="${CI_COMMIT_TAG:-latest}"
      trivy image \
        --severity HIGH,CRITICAL \
        --exit-code 0 \
        --format json \
        --output trivy-report.json \
        "$CI_REGISTRY_IMAGE:$IMAGE_TAG" || true

  artifacts:
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
    expire_in: 30 days

  allow_failure: true


# SAST: Semgrep static analysis
security:semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
    - echo "Running Semgrep SAST analysis..."
    - |
      semgrep \
        --config=semgrep.yml \
        --json \
        --output=semgrep-report.json \
        mcpgateway/ plugins/ || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - semgrep-report.json
    expire_in: 30 days
  allow_failure: true

# Dependency scanning: Safety
security:safety:
  stage: security
  image: python:3.12
  extends: .python_job
  script:
    - uv pip install --system safety 2>&1 | tail -10
    - echo "Checking dependencies for known vulnerabilities..."
    - safety check --json --output safety-report.json || true
  artifacts:
    paths:
      - safety-report.json
    expire_in: 30 days
  allow_failure: true

# License compliance check
security:license:
  stage: security
  image: python:3.12
  extends: .python_job
  script:
    - uv pip install --system pip-licenses 2>&1 | tail -10
    - echo "Checking license compliance..."
    - pip-licenses --format=json --with-urls --output-file licenses-report.json || true
  artifacts:
    paths:
      - licenses-report.json
    expire_in: 30 days
  allow_failure: true

# ═══════════════════════════════════════════════════════════════
# DEPLOY STAGE 
# ═══════════════════════════════════════════════════════════════

# Deploy to staging (manual trigger on main branch)
deploy:staging:
  stage: deploy
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "ci/setup-pipeline"'
  when: manual
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl jq ca-certificates
  script:
    - echo "Deploying to staging environment..."
    - echo "Placeholder for actual deployment logic (Helm, kubectl, etc.)"
    - echo "Image - $CI_REGISTRY_IMAGE:latest"
    - echo "Update your actual deployment commands here"
  environment:
    name: staging
    url: https://staging.example.com
  allow_failure: false

# Deploy to production (manual trigger on tags)
deploy:production:
  stage: deploy
  image: debian:bookworm-slim
  only:
    - ci/setup-pipeline
    - tags
  when: manual  
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl jq ca-certificates
  script:
    - echo "Deploying to production environment..."
    - echo "Placeholder for actual deployment logic (Helm, kubectl, etc.)"
    - echo "Image - $CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-latest}"
    - echo "Update your actual deployment commands here"
  environment:
    name: production
    url: https://api.example.com
  allow_failure: false


