# Integration Tests: Full source scanner test suite
test:integration:source_scanner:
  stage: test
  image: python:3.12
  extends: .python_job
  before_script:
    - python --version
    - |
      if command -v apt-get >/dev/null; then
        apt-get update && apt-get install -y --no-install-recommends jq git
      elif command -v apk >/dev/null; then
        apk add --no-cache jq git
      else
        echo "No package manager found to install jq" && exit 1
      fi
    - pip install --upgrade pip setuptools wheel uv
    - uv pip install --system --group dev . 2>&1 | tail -20
  script:
    - echo "Running Source Scanner Integration Tests..."
    - |
      uv run pytest \
        tests/integration/test_source_scanners/ \
        -v \
        -m integration \
        --tb=short \
        --junit-xml=integration_report.xml \
        --timeout=600
  artifacts:
    reports:
      junit: integration_report.xml
    paths:
      - integration_report.xml
    expire_in: 30 days
    when: always
  timeout: 25 minutes
  allow_failure: false
  only:
    - merge_requests
    - main
    - develop

