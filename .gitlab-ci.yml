  only:
    - main
  when: manual
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Deploying to staging environment..."
    - echo "Placeholder for actual deployment logic (Helm, kubectl, etc.)"
    - echo "Image - $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - echo "Update your actual deployment commands here"
  environment:
    name: staging
    url: https://staging.example.com
  allow_failure: false

# Deploy to production (manual trigger on tags)
deploy:production:
  stage: deploy
  image: alpine:latest
