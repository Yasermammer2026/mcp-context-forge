# ===============================================================
# GitLab CI/CD Pipeline Configuration for MCP Gateway
# featuring:
#   - Multi-stage pipeline (lint, test, build, deploy)
#   - Python 3.11, 3.12, 3.13 matrix testing
#   - Code quality checks (flake8, bandit, mypy, pylint)
#   - Unit tests with coverage reporting
#   - Docker image building and scanning
#   - Security scanning (CodeQL, SAST)
#   - Artifact management
#
# Environment Variables to Set in GitLab:
#   - REGISTRY_URL: Docker registry URL (e.g., registry.gitlab.com)
#   - REGISTRY_USER: Registry username
#   - REGISTRY_PASSWORD: Registry password/token
#   - SONAR_HOST_URL: SonarQube host (optional)
#   - SONAR_TOKEN: SonarQube token (optional)
#
# ===============================================================

# Global configuration
default:
  tags:
    - docker
    
stages:
  - code-quality
  - test
  - build
  - security
  - deploy

# Global variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_BUILDKIT: "1"
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"
  REGISTRY_URL: "${CI_REGISTRY}"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_VERSION: "0.9.2"

# Cache configuration
cache:
  paths:
    - .cache/pip
    - .venv/
    - .ruff_cache/
    - .mypy_cache/

.python_job:
  before_script:
    - python --version
    - |
      if command -v apt-get >/dev/null; then
        apt-get update && apt-get install -y --no-install-recommends jq
      elif command -v apk >/dev/null; then
        apk add --no-cache jq
      else
        echo "No package manager found to install jq" && exit 1
      fi
    - pip install --upgrade pip setuptools wheel uv

# Define which branches/tags trigger pipelines
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ===============================================================
# LINT & CODE QUALITY STAGE
# ===============================================================

# Lint: Formatting (Black, isort, trailing-whitespace)
lint:formatting:
  stage: code-quality
  image: python:3.12
  extends: .python_job
  script:
    - uv pip install --system black isort
    - echo "Checking code formatting (Black)..."
    - black --check --diff mcpgateway/ plugins/ tests/ scripts/ || true
    - echo "Checking import sorting (isort)..."
    - isort --check-only --diff mcpgateway/ plugins/ tests/ scripts/ || true
  allow_failure: true
  artifacts:
    reports:
      codequality: code-quality.json
    expire_in: 1 week

# Lint: Security analysis with Bandit
lint:security-bandit:
  stage: code-quality
  image: python:3.12
  extends: .python_job
  script:
    - uv pip install --system bandit
    - echo "Running Bandit security analysis..."
    - bandit -r mcpgateway/ plugins/ -f json -o bandit-report.json --severity-level medium || true
    - bandit -r mcpgateway/ plugins/ --severity-level medium || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true

# Lint: YAML validation
lint:yaml:
  stage: code-quality
  image: python:3.12
  script:
    - pip install --upgrade pip yamllint
    - echo "Validating YAML files..."
    - yamllint -c .yamllint docker-compose*.yml docker-compose*.yaml .github/workflows/*.yml .gitlab-ci.yml || true
  allow_failure: true

# Lint: Flake8
lint:flake8:
  stage: code-quality
  image: python:3.12
  extends: .python_job
  script:
    - uv pip install --system flake8 flake8-bugbear flake8-async
    - echo "Running Flake8..."
    - flake8 mcpgateway/ plugins/ tests/ scripts/ --config .flake8 --count || true 
  allow_failure: true
  artifacts:
    expire_in: 1 week

# ===============================================================
# TESTING STAGE
# ===============================================================

# Test: Unit tests with coverage (Python 3.11)
test:unit:py311:
  stage: test
  image: python:3.11
  extends: .python_job
  script:
    - uv pip install --system --group dev . 2>&1 | tail -20
    - python -c "import xdist; print('pytest-xdist OK')" || (echo "pytest-xdist missing"; exit 1)
    - echo "Running unit tests (Python 3.11) with coverage..."
    - |
      uv run pytest \
        --ignore=tests/fuzz \
        --cov=mcpgateway \
        --cov=plugins \
        --cov-report=xml \
        --cov-report=html \
        --cov-report=term \
        --cov-branch \
        --cov-fail-under=60 \
        -v \
        --tb=short \
        -n 4
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 30 days
  allow_failure: false

